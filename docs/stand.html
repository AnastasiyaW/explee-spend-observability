<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the stand behaves</title>
<link rel="stylesheet" href="site.css">
<style>
  /* Only the failure bar exists nowhere else. Frame, cards, table, tags and
     the footer all come from site.css. */
  :root{--wrap:1080px;--card-min:220px}
  .scroll table{min-width:600px}
  .bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--crit)}
  .share{display:flex;align-items:center;gap:9px}
  .share span{font-size:12px;font-variant-numeric:tabular-nums}
  /* A bar that grows with the viewport reads as a bigger number. Pinning the
     column keeps the same failure rate the same length on every screen. */
  #faults td:last-child,#providers td:last-child{width:210px}
</style>
<script src="i18n.js"></script>
</head>
<body>
<div class="wrap">
  <header class="pagehead">
    <nav class="backrow">
      <a class="back" href="spend.html" data-i18n="stand.back">&larr; back to spend</a>
      <a class="back quiet" href="./" data-i18n="stand.back.all">all three tasks</a>
    </nav>
    <h1 data-i18n="stand.h1">How the stand behaves</h1>
    <p class="sub" id="sub">loading…</p>
  </header>

  <div class="cards" id="cards"></div>

  <h2 class="sectionhead" data-i18n="stand.h2.faults">Failure taxonomy</h2>
  <div class="scroll">
    <table>
      <thead><tr><th data-i18n="stand.th.what">What came back</th><th class="num" data-i18n="stand.th.times">Times</th><th class="num" data-i18n="stand.th.hit">Providers hit</th><th data-i18n="stand.th.share">Share of all failures</th></tr></thead>
      <tbody id="faults"></tbody>
    </table>
  </div>

  <h2 class="sectionhead" data-i18n="stand.h2.per">Per account</h2>
  <div class="scroll">
    <table>
      <thead><tr><th data-i18n="stand.th.provider">Provider</th><th class="num" data-i18n="stand.th.reads">Reads</th><th class="num" data-i18n="stand.th.failed">Failed</th><th class="num" data-i18n="stand.th.rate">Failure rate</th><th></th></tr></thead>
      <tbody id="providers"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const DATA_URLS = [
  "data.json",
  "https://raw.githubusercontent.com/AnastasiyaW/explee-spend-observability/data/data.json"
];
const n = x => (x === null || x === undefined) ? "—" : Number(x).toLocaleString("en-US");

// Fault kinds carry the provider's own error text, and provider names come
// from the stand's catalog. Both are third-party strings headed for innerHTML.
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function rateClass(p){ return p >= 20 ? "crit" : p >= 5 ? "warn" : "ok"; }

let LAST = null;
function render(d){
  LAST = d;
  const a = d.api || {};
  if (!a.reads){
    document.getElementById("sub").textContent =
      t("stand.sub.noreads", "no reads recorded yet");
    return;
  }
  document.getElementById("sub").innerHTML = t("stand.sub",
    "Nothing here is documented by the provider. It is what {n} of our own reads actually "
    + "got back, over the last 24 hours.").replace("{n}", n(a.reads));

  const lat = a.latency_ms || {};
  document.getElementById("cards").innerHTML = [
    [t("stand.card.reads", "Reads"), n(a.reads),
     t("stand.card.reads.note", "one per provider per poll"), "ok"],
    [t("stand.card.success", "Success rate"), a.success_pct + "%",
     n(a.failed) + " " + t("stand.card.failed", "failed"), rateClass(100 - a.success_pct)],
    [t("stand.card.latency", "Latency p50 / p95"), n(lat.p50) + " / " + n(lat.p95) + " ms",
     t("stand.card.slowest", "slowest") + " " + n(lat.max) + " ms", "ok"],
    [t("stand.card.kinds", "Distinct fault kinds"), String((a.faults || []).length),
     t("stand.card.kinds.note", "each needs different handling"),
     (a.faults || []).length > 3 ? "warn" : "ok"]
  ].map(c => '<div class="card"><div class="lbl">' + c[0] + '</div><div class="big ' + c[3]
    + '">' + c[1] + '</div><div class="note">' + c[2] + '</div></div>').join("");

  const total = a.failed || 1;
  document.getElementById("faults").innerHTML = (a.faults || []).map(f => {
    const share = 100 * f.count / total;
    return '<tr><td><code>' + esc(f.kind) + '</code></td><td class="num">' + n(f.count)
      + '</td><td class="num">' + n(f.providers) + '</td>'
      + '<td><div class="share"><div class="bar"><i style="width:' + share.toFixed(1) + '%"></i></div>'
      + '<span class="muted">' + share.toFixed(1) + '%</span></div></td></tr>';
  }).join("");

  const pp = a.per_provider || {};
  document.getElementById("providers").innerHTML = Object.keys(pp).map(name => {
    const r = pp[name];
    return '<tr><td class="prov">' + esc(name) + '</td><td class="num">' + n(r.reads) + '</td><td class="num">'
      + n(r.failed) + '</td><td class="num ' + rateClass(r.failure_pct) + '">' + r.failure_pct
      + '%</td><td><div class="bar"><i style="width:' + Math.min(100, r.failure_pct * 3).toFixed(1)
      + '%"></i></div></td></tr>';
  }).join("");

  document.getElementById("foot").innerHTML = t("stand.foot",
      "The task never asked for this page — it asks for a dashboard that shows spend at a glance, and "
    + "for the monitor to cope with a service that misbehaves. Coping is only believable if the "
    + "misbehaviour is measured, so it lives here instead of crowding the number that matters.<br>"
    + "Every read is stored with its status, error text, latency and the first 600 bytes of the body, "
    + "so this table is a view over evidence rather than a counter someone incremented.")
    + " " + t("spend.foot.generated", "Generated") + " <code>" + esc(d.generated) + "</code>.";
}

async function load(){
  for (const url of DATA_URLS){
    try{
      const res = await fetch(url + "?t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) continue;
      render(await res.json());
      return;
    }catch(e){}
  }
  document.getElementById("sub").textContent =
    t("stand.loadfail", "could not load data.json from any source");
}
window.__rerender = () => { if (LAST) render(LAST); };
load();
setInterval(load, 60000);
</script>
</body>
</html>
