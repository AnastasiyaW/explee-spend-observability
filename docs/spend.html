<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend Observability</title>
<link rel="stylesheet" href="site.css">
<style>
  /* Only the parts that exist nowhere else: the collector status strip, the
     sparkline and the alert feed. Frame, cards, table and tags: site.css. */
  :root{--wrap:1180px;--card-min:230px}
  .scroll table{min-width:820px}
  .banner{padding:11px 14px;margin:0 0 16px;font-size:13px;
    display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .banner .k{color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
  .attn{border-left:3px solid var(--crit)}
  .alerts{padding:2px 0;max-height:420px;overflow-y:auto}
  .alert{padding:8px 14px;border-bottom:1px solid var(--grid);font-size:13px;
    display:flex;gap:11px;align-items:flex-start}
  .alert:last-child{border-bottom:0}
  .alert time{color:var(--muted);font:11.5px/1.6 var(--f-mono);white-space:nowrap}
  .empty{padding:24px 14px;color:var(--muted);font-size:13px;text-align:center;max-width:70ch;margin:0 auto}
  svg.spark{display:block}
  #alertnote{margin:-2px 0 8px}
  .alertmore{display:flex;gap:10px;align-items:center;margin:9px 0 0}
  .alertmore button{font:600 11px/1 var(--f-sans);letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
    border-radius:20px;padding:7px 13px}
  .alertmore button:hover{border-color:var(--accent);color:var(--accent)}
  .alertmore .count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  /* The way through to the evidence page. One filled control on the page, and
     it is small: the numbers above it stay the loudest thing here. */
  #standlink{margin:18px 0 0;font-size:13px;line-height:2.2}
</style>
<script src="i18n.js"></script>
</head>
<body>
<div class="wrap">
  <header class="pagehead">
    <nav class="backrow"><a class="back" href="./" data-i18n="spend.back">&larr; all three tasks</a></nav>
    <h1 data-i18n="spend.h1">Spend observability</h1>
    <p class="sub" id="sub">loading…</p>
  </header>

  <div class="panel banner" id="banner"></div>
  <div class="cards" id="cards"></div>

  <h2 class="sectionhead" data-i18n="spend.h2.table">Every account, soonest to run out first</h2>
  <div class="scroll">
    <table>
      <thead><tr>
        <th data-i18n="spend.th.provider">Provider</th>
        <th data-i18n="spend.th.model">Model</th>
        <th class="num" data-i18n="spend.th.balance">Balance</th>
        <th class="num" data-i18n="spend.th.burn">Burn / h</th>
        <th class="num" data-i18n="spend.th.normal">Normal / h</th>
        <th class="num" data-i18n="spend.th.runway">Runway</th>
        <th data-i18n="spend.th.spark">Last 6h</th>
        <th data-i18n="spend.th.health">Health</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="sub" id="standlink"></p>

  <h2 class="sectionhead" data-i18n="spend.h2.alerts">Alerts</h2>
  <p class="sub" id="alertnote"></p>
  <div class="panel alerts" id="alerts"></div>
  <div class="alertmore" id="alertmore"></div>

  <footer id="foot"></footer>
</div>

<script>
const DATA_URLS = [
  "data.json",
  "https://raw.githubusercontent.com/AnastasiyaW/explee-spend-observability/data/data.json"
];

// Everything below this line except our own numbers came from the stand, and the
// whole design says the stand is not to be trusted. A provider that answers
// {"error":"<img src=x onerror=...>"} would otherwise have that string stored,
// published in data.json and executed here.
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function n(x){
  return (x === null || x === undefined) ? "\u2014" : Number(x).toLocaleString("en-US");
}
function fmt(n, digits){
  if (n === null || n === undefined) return "—";
  const d = digits === undefined ? 2 : digits;
  return Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function hours(h){
  if (h === null || h === undefined) return "—";
  if (h < 1) return Math.round(h * 60) + " " + t("unit.min", "min");
  if (h < 48) return h.toFixed(1) + " " + t("unit.h", "h");
  return (h / 24).toFixed(1) + " " + t("unit.d", "d");
}
function runwayClass(h){
  if (h === null || h === undefined) return "muted";
  if (h <= 6) return "crit";
  if (h <= 24) return "warn";
  return "ok";
}
function spark(series){
  if (!series || series.length < 2) return '<span class="muted">—</span>';
  const w = 110, h = 26, vals = series.map(p => p[1]);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const t0 = series[0][0], t1 = series[series.length-1][0], dt = (t1 - t0) || 1;
  const pts = series.map(p =>
    ((p[0]-t0)/dt*w).toFixed(1) + "," + (h - (p[1]-lo)/span*(h-3) - 1.5).toFixed(1)).join(" ");
  const rising = vals[vals.length-1] > vals[0];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'
    + '<polyline fill="none" stroke="'+(rising ? "var(--ok)" : "var(--accent)")
    + '" stroke-width="1.5" stroke-linejoin="round" points="'+pts+'"/></svg>';
}
function ago(iso){
  const secs = (Date.now() - new Date(iso).getTime())/1000;
  if (secs < 90) return Math.round(secs) + t("ago.s", "s ago");
  if (secs < 5400) return Math.round(secs/60) + " " + t("ago.min", "min ago");
  return (secs/3600).toFixed(1) + " " + t("ago.h", "h ago");
}

let LAST = null;

// The snapshot carries the most recent sixty lines. The rest of the log is on
// the branch the collector publishes to, fetched only if someone asks for it -
// there is deliberately no copy of alerts.jsonl in docs/, because a committed
// copy is wrong within five minutes of being committed.
const ALERTS_RAW =
  "https://raw.githubusercontent.com/AnastasiyaW/explee-spend-observability/data/alerts.jsonl";
const PAGE = 60;
let ALERTS = [], SHOWN = PAGE, FULL = false, LOADING = false;

function renderAlerts(){
  const box = document.getElementById("alerts");
  if (!ALERTS.length){
    box.innerHTML = '<div class="empty">' + t("spend.alerts.empty",
      "No alerts yet. The collector suppresses anomaly alerts until it has enough of its own "
      + "history to know what normal is.") + '</div>';
    document.getElementById("alertmore").innerHTML = "";
    return;
  }
  box.innerHTML = ALERTS.slice(0, SHOWN).map(a =>
    '<div class="alert"><time>' + esc(a.ts || "") + '</time>'
    + '<span class="' + (a.level === "critical" ? "crit" : a.level === "warn" ? "warn" : "muted") + '">'
    + (a.level === "critical" ? "●" : a.level === "warn" ? "▲" : "·") + '</span>'
    + '<span>' + esc(a.text || "") + '</span></div>').join("");

  const more = document.getElementById("alertmore");
  const remaining = ALERTS.length - SHOWN;
  if (!FULL || remaining > 0){
    more.innerHTML = '<button type="button" id="alertmorebtn">'
      + (LOADING ? t("spend.alerts.loading", "loading\u2026")
         : t("spend.alerts.more", "Show 60 more"))
      + '</button><span class="count">' + Math.min(SHOWN, ALERTS.length) + " / "
      + (FULL ? ALERTS.length : t("spend.alerts.ofall", "the whole log")) + '</span>';
    document.getElementById("alertmorebtn").addEventListener("click", showMoreAlerts);
  } else {
    more.innerHTML = '<span class="count">' + ALERTS.length + " "
      + t("spend.alerts.allshown", "lines, the whole log") + '</span>';
  }
}

async function showMoreAlerts(){
  if (LOADING) return;
  if (!FULL){
    // First press: pull the whole file, once.
    LOADING = true; renderAlerts();
    try {
      const res = await fetch(ALERTS_RAW + "?t=" + Date.now(), {cache: "no-store"});
      if (!res.ok) throw new Error(String(res.status));
      const lines = (await res.text()).split("\n").filter(l => l.trim());
      const parsed = [];
      for (const line of lines){
        try { parsed.push(JSON.parse(line)); } catch (e) { /* a torn line is not a reason to fail */ }
      }
      if (parsed.length) { ALERTS = parsed.reverse(); FULL = true; }
    } catch (e) {
      document.getElementById("alertmore").innerHTML = '<span class="count">'
        + t("spend.alerts.morefail", "could not read the full log") + '</span>';
      LOADING = false;
      return;
    }
    LOADING = false;
  }
  SHOWN += PAGE;
  renderAlerts();
}

function render(d){
  LAST = d;
  const ps = d.providers || [];
  const alerts = d.alerts || [];
  const stale = Math.round((Date.now() - new Date(d.generated).getTime())/1000);

  document.getElementById("sub").innerHTML =
    "<b>" + ps.length + "</b> " + t("spend.sub.accounts", "accounts watched") + " · "
    + t("spend.sub.data", "data") + " " + ago(d.generated)
    + " · <b>" + alerts.length + "</b> " + t("spend.sub.alerts", "alerts on file");

  const w = d.world || {};
  document.getElementById("banner").innerHTML =
    '<span><span class="dot" style="background:' + (stale < 180 ? "var(--ok)" : "var(--crit)") + '"></span>'
    + (stale < 180 ? t("spend.live", "collector live")
                   : t("spend.stale", "collector stale") + " (" + Math.round(stale/60) + " "
                     + t("unit.min", "min") + ")") + '</span>'
    + '<span><span class="k">' + t("spend.world", "world") + '</span> <code>'
    + esc(w.fingerprint || "?") + '</code></span>'
    + '<span><span class="k">' + t("spend.epoch", "epoch") + '</span> <code>'
    + (w.world_epoch ? new Date(w.world_epoch*1000).toISOString().replace(".000Z","Z") : "?") + '</code></span>'
    + '<span class="k">' + t("spend.worldnote", "history resets if either changes") + '</span>';

  // The headline numbers. There is deliberately no single "total spend":
  // usd, gbp and credits do not add up, and two accounts expose no balance.
  const withRunway = ps.filter(p => p.runway_h !== null && p.runway_h !== undefined);
  const soonest = withRunway.length ? withRunway[0] : null;
  const critical = withRunway.filter(p => p.runway_h <= 6).length;
  const warning = withRunway.filter(p => p.runway_h > 6 && p.runway_h <= 24).length;
  const unhealthy = ps.filter(p => !p.healthy);
  const usdBurn = ps.filter(p => (p.unit||"").toLowerCase() === "usd")
                    .reduce((s,p) => s + (p.burn_per_h||0), 0);

  document.getElementById("cards").innerHTML = [
    [t("spend.card.soonest", "Soonest to run dry"), soonest ? hours(soonest.runway_h) : "—",
     soonest ? esc(soonest.provider) : t("spend.card.soonest.none", "no burn measured yet"),
     soonest ? runwayClass(soonest.runway_h) : "muted"],
    [t("spend.card.under24", "Accounts under 24h"), String(critical + warning),
     critical + " " + t("spend.card.under6", "under 6h"), (critical ? "crit" : warning ? "warn" : "ok")],
    [t("spend.card.usdburn", "USD burn right now"), "$" + fmt(usdBurn, 2) + "/h",
     t("spend.card.usdburn.note", "usd accounts only — gbp and credits are not summable"), "ok"],
    [t("spend.card.silent", "Not reporting"), String(unhealthy.length),
     unhealthy.length ? unhealthy.map(p=>esc(p.provider)).join(", ")
                      : t("spend.card.silent.none", "all accounts answering"),
     unhealthy.length ? "warn" : "ok"]
  ].map(c =>
    '<div class="card' + (c[3]==="crit" ? " attn" : "") + '"><div class="lbl">' + c[0] + '</div>'
    + '<div class="big ' + c[3] + '">' + c[1] + '</div><div class="note">' + c[2] + '</div></div>'
  ).join("");

  document.getElementById("rows").innerHTML = ps.map(p => {
    const unit = esc((p.unit || "").toUpperCase());
    let bal = "—";
    if (p.value !== null && p.value !== undefined){
      bal = fmt(p.value, p.model === "credits_package" ? 0 : 2) + " " + unit;
      if (p.capacity) bal += ' <span class="muted">/ ' + fmt(p.capacity,0) + '</span>';
    } else if (p.spend_24h !== null && p.spend_24h !== undefined){
      bal = '<span class="muted">' + t("spend.nobalance", "no balance · 24h spend")
            + '</span> ' + fmt(p.spend_24h,2) + " " + unit;
    }
    return '<tr>'
      + '<td class="prov">' + esc(p.provider)
        + (p.topups_6h ? ' <span class="tag">' + p.topups_6h + ' '
             + t("spend.topup", "top-up") + '</span>' : '') + '</td>'
      + '<td><span class="tag">' + esc(t("spend.model." + (p.model || ""),
             (p.model || "?").replace(/_/g," "))) + '</span></td>'
      + '<td class="num">' + bal + '</td>'
      + '<td class="num">' + (p.burn_per_h ? fmt(p.burn_per_h, 3) : '<span class="muted">—</span>') + '</td>'
      + '<td class="num">' + (p.baseline_per_h ? fmt(p.baseline_per_h, 3)
          : '<span class="muted">' + t("spend.warming", "warming") + '</span>') + '</td>'
      + '<td class="num ' + runwayClass(p.runway_h) + '">' + hours(p.runway_h) + '</td>'
      + '<td>' + spark(p.series) + '</td>'
      + '<td>' + (p.healthy ? '<span class="ok">' + t("spend.ok", "ok") + '</span>'
          : '<span class="warn">' + esc(p.last_error || t("spend.nodata", "no data"))
            + '</span>') + '</td>'
      + '</tr>';
  }).join("");

  ALERTS = alerts;
  renderAlerts();
  document.getElementById("alertnote").innerHTML = (alerts.length && LANG !== "en")
    ? t("spend.alerts.verbatim", "") : "";

  const api = d.api || {};
  // What the other few per cent were. The number without this raises the
  // question and sends the reader to another page to answer it.
  const worst = (api.faults || []).slice(0, 2)
    .map(f => esc(String(f.kind).replace(/^(\d{3}|-)\s*/, m => m.trim() === "-" ? "" : m))
              + " <b>" + n(f.count) + "</b>")
    .join(", ");
  document.getElementById("standlink").innerHTML = api.reads
    ? t("spend.standlink.a", "The stand answered") + ' <b>' + api.success_pct + '%</b> '
      + t("spend.standlink.of", "of") + ' ' + api.reads.toLocaleString("en-US") + ' '
      + t("spend.standlink.b", "reads")
      + (worst ? ' <span class="sep">&middot;</span> '
                 + t("spend.standlink.mostly", "the failures are mostly") + ' ' + worst : '')
      + ' <span class="sep">&middot;</span> <a class="btn" href="stand.html">'
      + t("spend.standlink.go", "how it misbehaves &rarr;") + '</a>'
    : '<a class="btn" href="stand.html">'
      + t("spend.standlink.plain", "how the stand behaves &rarr;") + '</a>';

  // The window note is generated by the collector in English. Rather than show a
  // half-translated sentence, the Russian side rebuilds it from the one number it
  // carries, and falls back to the original if that number is not where expected.
  const windowHours = (d.window_note || "").match(/last (\d+(?:\.\d+)?)h/);
  const noteEn = d.window_note
    ? esc(d.window_note.charAt(0).toUpperCase() + d.window_note.slice(1)) + "." : "";
  const note = (LANG === "en" || !windowHours)
    ? noteEn
    : t("spend.foot.window", noteEn).replace("{h}", windowHours[1]);
  document.getElementById("foot").innerHTML = t("spend.foot",
      "There is no total-spend number here on purpose: the accounts are denominated in USD, GBP and "
    + "credits, and two of them expose no balance at all — only trailing cost. The one quantity that "
    + "is comparable across all of them is <b>runway</b>, so the table is sorted by it.")
    + "<br>" + note
    + " " + t("spend.foot.generated", "Generated") + " <code>" + esc(d.generated) + "</code>.";
}

async function load(){
  for (const url of DATA_URLS){
    try {
      const res = await fetch(url + "?t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) continue;
      render(await res.json());
      return;
    } catch (e) { /* try the next source */ }
  }
  document.getElementById("sub").textContent = t("spend.loadfail",
    "could not load data.json from any source — the collector may not have published yet");
}
window.__rerender = () => { if (LAST) render(LAST); };
load();
setInterval(load, 30000);
</script>
</body>
</html>
